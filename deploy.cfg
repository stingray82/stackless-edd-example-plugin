; Existing deploy.sh, unchanged. Place this next to deploy.sh at repo root.
PLUGIN_NAME=Example Plugin
PLUGIN_SLUG=example-plugin
PLUGIN_DIR=example-plugin
PLUGIN_FILE=example-plugin/example-plugin.php
PLUGIN_TAGS=wordpress,edd,licensing,uupd
ZIP_NAME=

; Publish GitHub release first, then Stackless EDD release.
DEPLOY_TARGET=github+edd
GITHUB_REPO=stingray82/stackless-edd-example-plugin

; Stackless EDD test store.
EDD_STORE_URL=https://stacklessedd.tdlab.uk
EDD_SOFTWARE_SLUG=example-plugin

; Numeric EDD Download/Product ID from WordPress admin.
EDD_DOWNLOAD_ID=296

; append creates release history; replace updates the active release.
EDD_DOWNLOAD_MODE=replace

; Shared deployment tools.
UNIVERSAL_HOME=C:/Ignore By Avast/0. PATHED Items/Plugins/deployscripts/universal
CHANGELOG_FILE=changelog.md
STATIC_FILE=static.txt
SEVEN_ZIP=C:/Program Files/7-Zip/7z.exe

; Credential profiles.
GITHUB_CREDENTIAL_PROFILE=stingray82
EDD_CREDENTIAL_PROFILE=edddeploy-example-plugin

; Set 1 for safe local testing (no remote calls).
DEPLOY_DRY_RUN=0

; Git source publishing settings.
GIT_PUSH_SOURCE=0
GIT_BRANCH=main

; Remove local release ZIPs after successful deployment.
CLEANUP_RELEASE_ZIPS=1
